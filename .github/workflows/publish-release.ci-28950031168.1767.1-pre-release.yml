name: ci-28950031168.1767.1-pre-release
'on':
  push:
    tags:
      - '*'
jobs:
  publish:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Publish release
        uses: >-
          ghalactic/github-release-from-tag@bdc1623f371aba0636b63460e5f1add10735493a
        with:
          makeLatest: never
        id: publishRelease
      - name: Expose outputs.assets
        env:
          PUBLISH_RELEASE_OUTPUT: ${{ toJSON(steps.publishRelease.outputs.assets) }}
        run: >-
          echo ::notice
          title=outputs.assets::outputs.assets=$PUBLISH_RELEASE_OUTPUT
      - name: Expose outputs.discussionId
        env:
          PUBLISH_RELEASE_OUTPUT: ${{ toJSON(steps.publishRelease.outputs.discussionId) }}
